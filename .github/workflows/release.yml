name: Build and Release

on:
  push:
    tags:
      - 'v*' # This workflow triggers when you push a tag that starts with "v"

# Add this permissions block
permissions:
  contents: write # This allows the workflow to create releases

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: silence
            asset_name: silence-linux-amd64
          - os: windows-latest
            artifact_name: silence.exe
            asset_name: silence-windows-amd64.exe
          - os: macos-latest
            artifact_name: silence
            asset_name: silence-macos-amd64

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.x'

    - name: Build
      run: |
        go build -o ${{ matrix.artifact_name }} ./cmd/silence
      
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}
        overwrite: true